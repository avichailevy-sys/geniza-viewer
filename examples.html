<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GenizaNexus Examples</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Hebrew:wght@400;600&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="site.css">
<script src="unified.js"></script>
<script src="records-ui.js"></script>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
// Seven fixed examples, chosen from the data. Generated by examples.template.html + the record data.
const EXAMPLES = [{"kind": "agree", "tag": "Sources agree", "titleEn": "Babylonian Talmud, Seder Moed (Sukkah)", "why": "All three sources say this is Babylonian Talmud. The catalogue and passim also agree on the order (Seder Moed) and the tractate (Sukkah). FGP gives only the corpus here, so it is silent below that level. This is as close to full agreement as the data gets: across the catalogue, no fragment has all three sources agreeing at every level.", "rec": {"uri": "https://avichailevy-sys.github.io/geniza-viewer/id/36762586/7", "ie": "36762586", "page": 7, "alma": "990001436470205171", "shelfmark": "Ms. EVR II A 293/10", "library": "The National Library of Russia", "city": "St. Petersburg", "catalogueTitle": "תלמוד בבלי סדר מועד (סוכה).", "passimCoverage": 0.888888889, "classification": "enrichment", "nliUrl": "https://www.nli.org.il/en/manuscripts/NNL_ALEPH990001436470205171/NLI", "imgUrl": "https://api.nli.org.il/openlibrary/api/iiif/36762586!7/full/800,/0/default.jpg", "claims": {"passim": {"corpus": "talmud_bavli", "subcorpus": "Seder Moed", "tractate": "Sukkah"}, "fgp": {"corpus": "talmud_bavli", "subcorpus": null, "tractate": null}, "ktiv": {"corpus": "talmud_bavli", "subcorpus": "Seder Moed", "tractate": "Sukkah"}}, "levels": {"corpus": {"status": "confirmed", "value": "talmud_bavli", "candidates": [{"value": "talmud_bavli", "sources": ["passim", "fgp", "ktiv"]}]}, "subcorpus": {"status": "supported", "value": "Seder Moed", "candidates": [{"value": "Seder Moed", "sources": ["passim", "ktiv"]}]}, "tractate": {"status": "supported", "value": "Sukkah", "candidates": [{"value": "Sukkah", "sources": ["passim", "ktiv"]}]}}}}, {"kind": "agree", "tag": "Sources agree", "titleEn": "Babylonian Talmud, Seder Nezikin (Sanhedrin)", "why": "The same pattern with another tractate: three sources agree on the corpus, two agree on the order and the tractate. The unified record states the value and shows exactly how many sources stand behind it at each level.", "rec": {"uri": "https://avichailevy-sys.github.io/geniza-viewer/id/36770021/5", "ie": "36770021", "page": 5, "alma": "990001438410205171", "shelfmark": "Ms. EVR II A 409/4", "library": "The National Library of Russia", "city": "St. Petersburg", "catalogueTitle": "תלמוד בבלי סדר נזיקין (סנהדרין).", "passimCoverage": 0.773584906, "classification": "enrichment", "nliUrl": "https://www.nli.org.il/en/manuscripts/NNL_ALEPH990001438410205171/NLI", "imgUrl": "https://api.nli.org.il/openlibrary/api/iiif/36770021!5/full/800,/0/default.jpg", "claims": {"passim": {"corpus": "talmud_bavli", "subcorpus": "Seder Nezikin", "tractate": "Sanhedrin"}, "fgp": {"corpus": "talmud_bavli", "subcorpus": null, "tractate": null}, "ktiv": {"corpus": "talmud_bavli", "subcorpus": "Seder Nezikin", "tractate": "Sanhedrin"}}, "levels": {"corpus": {"status": "confirmed", "value": "talmud_bavli", "candidates": [{"value": "talmud_bavli", "sources": ["passim", "fgp", "ktiv"]}]}, "subcorpus": {"status": "supported", "value": "Seder Nezikin", "candidates": [{"value": "Seder Nezikin", "sources": ["passim", "ktiv"]}]}, "tractate": {"status": "supported", "value": "Sanhedrin", "candidates": [{"value": "Sanhedrin", "sources": ["passim", "ktiv"]}]}}}}, {"kind": "complement", "tag": "Sources complete each other", "titleEn": "Bible [text]", "why": "The catalogue and FGP say only that this is Bible. passim aligned the text to Sefaria and found Genesis. Nothing conflicts: passim adds the sub-corpus (Torah) and the book. The unified record keeps Genesis as a single-source value, so a reader can see that only the computational source supports it.", "rec": {"uri": "https://avichailevy-sys.github.io/geniza-viewer/id/163089889/4", "ie": "163089889", "page": 4, "alma": "990051113930205171", "shelfmark": "Ms. T-S A 1.51", "library": "Cambridge University Library", "city": "Cambridge", "catalogueTitle": "מקרא [טקסט].", "passimCoverage": 1, "classification": "enrichment", "nliUrl": "https://www.nli.org.il/en/manuscripts/NNL_ALEPH990051113930205171/NLI", "imgUrl": "https://api.nli.org.il/openlibrary/api/iiif/163089889!4/full/800,/0/default.jpg", "claims": {"passim": {"corpus": "tanakh", "subcorpus": "Torah", "tractate": "Genesis"}, "fgp": {"corpus": "tanakh", "subcorpus": null, "tractate": null}, "ktiv": {"corpus": "tanakh", "subcorpus": null, "tractate": null}}, "levels": {"corpus": {"status": "confirmed", "value": "tanakh", "candidates": [{"value": "tanakh", "sources": ["passim", "fgp", "ktiv"]}]}, "subcorpus": {"status": "single", "value": "Torah", "candidates": [{"value": "Torah", "sources": ["passim"]}]}, "tractate": {"status": "single", "value": "Genesis", "candidates": [{"value": "Genesis", "sources": ["passim"]}]}}}}, {"kind": "complement", "tag": "Sources complete each other", "titleEn": "Bible [text]", "why": "Another fragment catalogued only as Bible. passim places it in the Writings, in Psalms. This is the most common case in the data: about 96% of fragments are enrichments, where one source adds detail the others lack.", "rec": {"uri": "https://avichailevy-sys.github.io/geniza-viewer/id/166109267/2", "ie": "166109267", "page": 2, "alma": "990051116260205171", "shelfmark": "Ms. T-S A 13.19", "library": "Cambridge University Library", "city": "Cambridge", "catalogueTitle": "מקרא [טקסט].", "passimCoverage": 1, "classification": "enrichment", "nliUrl": "https://www.nli.org.il/en/manuscripts/NNL_ALEPH990051116260205171/NLI", "imgUrl": "https://api.nli.org.il/openlibrary/api/iiif/166109267!2/full/800,/0/default.jpg", "claims": {"passim": {"corpus": "tanakh", "subcorpus": "Writings", "tractate": "Psalms"}, "fgp": {"corpus": "tanakh", "subcorpus": null, "tractate": null}, "ktiv": {"corpus": "tanakh", "subcorpus": null, "tractate": null}}, "levels": {"corpus": {"status": "confirmed", "value": "tanakh", "candidates": [{"value": "tanakh", "sources": ["passim", "fgp", "ktiv"]}]}, "subcorpus": {"status": "single", "value": "Writings", "candidates": [{"value": "Writings", "sources": ["passim"]}]}, "tractate": {"status": "single", "value": "Psalms", "candidates": [{"value": "Psalms", "sources": ["passim"]}]}}}}, {"kind": "disagree", "tag": "Sources disagree", "titleEn": "Piyyut (liturgical poem)", "why": "The catalogue and FGP say liturgy; passim finds the text of Amos. Both may be right: liturgical poems often quote or rework biblical verses, and passim reports the text it can align. The record keeps both claims, marks the corpus as contested, and does not choose. Settling it needs a person looking at the image.", "rec": {"uri": "https://avichailevy-sys.github.io/geniza-viewer/id/161475434/2", "ie": "161475434", "page": 2, "alma": "990051506630205171", "shelfmark": "Ms. T-S NS 139.20", "library": "Cambridge University Library", "city": "Cambridge", "catalogueTitle": "פיוט.", "passimCoverage": 1, "classification": "contradiction", "nliUrl": "https://www.nli.org.il/en/manuscripts/NNL_ALEPH990051506630205171/NLI", "imgUrl": "https://api.nli.org.il/openlibrary/api/iiif/161475434!2/full/800,/0/default.jpg", "claims": {"passim": {"corpus": "tanakh", "subcorpus": "Prophets", "tractate": "Amos"}, "fgp": {"corpus": "liturgy", "subcorpus": null, "tractate": null}, "ktiv": {"corpus": "liturgy", "subcorpus": null, "tractate": null}}, "levels": {"corpus": {"status": "contested", "value": null, "candidates": [{"value": "liturgy", "sources": ["fgp", "ktiv"]}, {"value": "tanakh", "sources": ["passim"]}]}, "subcorpus": {"status": "single", "value": "Prophets", "candidates": [{"value": "Prophets", "sources": ["passim"]}]}, "tractate": {"status": "single", "value": "Amos", "candidates": [{"value": "Amos", "sources": ["passim"]}]}}}}, {"kind": "disagree", "tag": "Sources disagree", "titleEn": "Bible; Bible [text]", "why": "The reverse case. The catalogue and FGP say Bible; passim matches the text to the prayer book (Siddur). Prayer books contain long biblical passages, so the same words can fit both. Again, both claims are kept with their sources.", "rec": {"uri": "https://avichailevy-sys.github.io/geniza-viewer/id/160090344/2", "ie": "160090344", "page": 2, "alma": "990051421340205171", "shelfmark": "Ms. T-S NS 40.62", "library": "Cambridge University Library", "city": "Cambridge", "catalogueTitle": "מקרא;מקרא [טקסט].", "passimCoverage": 1, "classification": "contradiction", "nliUrl": "https://www.nli.org.il/en/manuscripts/NNL_ALEPH990051421340205171/NLI", "imgUrl": "https://api.nli.org.il/openlibrary/api/iiif/160090344!2/full/800,/0/default.jpg", "claims": {"passim": {"corpus": "liturgy", "subcorpus": "Siddur", "tractate": null}, "fgp": {"corpus": "tanakh", "subcorpus": null, "tractate": null}, "ktiv": {"corpus": "tanakh", "subcorpus": null, "tractate": null}}, "levels": {"corpus": {"status": "contested", "value": null, "candidates": [{"value": "tanakh", "sources": ["fgp", "ktiv"]}, {"value": "liturgy", "sources": ["passim"]}]}, "subcorpus": {"status": "single", "value": "Siddur", "candidates": [{"value": "Siddur", "sources": ["passim"]}]}, "tractate": {"status": null, "value": null, "candidates": []}}}}, {"kind": "disagree", "tag": "Sources disagree", "titleEn": "Glossary to a piyyut", "why": "The catalogue calls this a glossary to a liturgical poem; passim finds Genesis. A glossary explains words, and those words may come from biblical verses the poem draws on. Here the disagreement is about what kind of text this is, not only about where its words come from.", "rec": {"uri": "https://avichailevy-sys.github.io/geniza-viewer/id/159707716/2", "ie": "159707716", "page": 2, "alma": "990051395170205171", "shelfmark": "Ms. T-S NS 26.50", "library": "Cambridge University Library", "city": "Cambridge", "catalogueTitle": "גלוסאר לפיוט.", "passimCoverage": 1, "classification": "contradiction", "nliUrl": "https://www.nli.org.il/en/manuscripts/NNL_ALEPH990051395170205171/NLI", "imgUrl": "https://api.nli.org.il/openlibrary/api/iiif/159707716!2/full/800,/0/default.jpg", "claims": {"passim": {"corpus": "tanakh", "subcorpus": "Torah", "tractate": "Genesis"}, "fgp": {"corpus": "liturgy", "subcorpus": null, "tractate": null}, "ktiv": {"corpus": "liturgy", "subcorpus": null, "tractate": null}}, "levels": {"corpus": {"status": "contested", "value": null, "candidates": [{"value": "liturgy", "sources": ["fgp", "ktiv"]}, {"value": "tanakh", "sources": ["passim"]}]}, "subcorpus": {"status": "single", "value": "Torah", "candidates": [{"value": "Torah", "sources": ["passim"]}]}, "tractate": {"status": "single", "value": "Genesis", "candidates": [{"value": "Genesis", "sources": ["passim"]}]}}}}];
const app = document.getElementById('app');
const groups = [
  ['agree', 'When the sources agree'],
  ['complement', 'When the sources complete each other'],
  ['disagree', 'When the sources disagree'],
];
let html = topNavHTML() + `
  <h1>From three identifications to one linked record</h1>
  <p class="sub">Worked examples for the GenizaNexus unified catalogue</p>
  <div class="note">
    Each Cairo Geniza fragment below has been identified three times, independently:
    by <b>passim</b> (computational text-reuse alignment against Sefaria),
    by the <b>Friedberg Geniza Project (FGP)</b>, and by the <b>National Library of Israel catalogue (NLI/KTIV)</b>.
    For each fragment you see (1) what each source says, (2) the unified record, which keeps every value with the sources behind it,
    and (3) the same record as Linked Data. Every record has its own address, links to Wikidata and Sefaria where a mapping exists,
    and can be opened in the viewer.
  </div>
  <p style="font-size:14px"><b>Status of each level:</b>
    <span class="st confirmed">Confirmed</span> all three sources ·
    <span class="st supported">Supported</span> two sources, third silent ·
    <span class="st single">Single source</span> ·
    <span class="st contested">Contested</span> sources disagree, nothing is chosen</p>
  <ol class="toc">${groups.map(([k, t]) => `<li><a href="#${k}">${t}</a> (${EXAMPLES.filter(e => e.kind === k).length})</li>`).join('')}</ol>`;
for (const [k, t] of groups) {
  html += `<h2 id="${k}">${t}</h2>`;
  EXAMPLES.filter(e => e.kind === k).forEach((e, i) => {
    html += recordCardHTML(e.rec, {
      tag: `<span class="tag ${k}">${e.tag}</span>`,
      titleEn: e.titleEn,
      why: e.why,
      openTtl: k === 'disagree' && i === 0,
    });
  });
}
html += `<p class="sub" style="margin-top:30px">The whole catalogue (68,989 fragment images) can be downloaded as Turtle, JSON-LD or CSV from the viewer. Terms used in the data: <a href="${GN_BASE}ns">GenizaNexus vocabulary</a>. Method: <a href="https://doi.org/10.5281/zenodo.21810900">doi.org/10.5281/zenodo.21810900</a>.</p>`;
app.innerHTML = html;
</script>
</body>
</html>
