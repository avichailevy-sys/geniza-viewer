uri": "https://avichailevy-sys.github.io/geniza-viewer/id/36770021/5", "ie": "36770021", "page": 5, "alma": "990001438410205171", "shelfmark": "Ms. EVR II A 409/4", "library": "The National Library of Russia", "city": "St. Petersburg", "catalogueTitle": "תלמוד בבלי סדר נזיקין (סנהדרין).", "passimCoverage": 0.773584906, "classification": "enrichment", "nliUrl": "https://www.nli.org.il/en/manuscripts/NNL_ALEPH990001438410205171/NLI", "imgUrl": "https://api.nli.org.il/openlibrary/api/iiif/36770021!5/full/800,/0/default.jpg", "claims": {"passim": {"corpus": "talmud_bavli", "subcorpus": "Seder Nezikin", "tractate": "Sanhedrin"}, "fgp": {"corpus": "talmud_bavli", "subcorpus": null, "tractate": null}, "ktiv": {"corpus": "talmud_bavli", "subcorpus": "Seder Nezikin", "tractate": "Sanhedrin"}}, "levels": {"corpus": {"status": "confirmed", "value": "talmud_bavli", "candidates": [{"value": "talmud_bavli", "sources": ["passim", "fgp", "ktiv"]}]}, "subcorpus": {"status": "supported", "value": "Seder Nezikin", "candidates": [{"value": "Seder Nezikin", "sources": ["passim", "ktiv"]}]}, "tractate": {"status": "supported", "value": "Sanhedrin", "candidates": [{"value": "Sanhedrin", "sources": ["passim", "ktiv"]}]}}}}, {"kind": "complement", "tag": "Sources complete each other", "titleEn": "Bible [text]", "why": "The catalogue and FGP say only that this is Bible. passim aligned the text to Sefaria and found Genesis. Nothing conflicts: passim adds the sub-corpus (Torah) and the book. The unified record keeps Genesis as a single-source value, so a reader can see that only the computational source supports it.", "rec": {"uri": "https://avichailevy-sys.github.io/geniza-viewer/id/163089889/4", "ie": "163089889", "page": 4, "alma": "990051113930205171", "shelfmark": "Ms. T-S A 1.51", "library": "Cambridge University Library", "city": "Cambridge", "catalogueTitle": "מקרא [טקסט].", "passimCoverage": 1, "classification": "enrichment", "nliUrl": "https://www.nli.org.il/en/manuscripts/NNL_ALEPH9 }]}, "tractate": {"status": "single", "value": "Psalms", "candidates": [{"value": "Psalms", "sources": ["passim"]}]}}}}, {"kind": "disagree", "tag": "Sources disagree", "titleEn": "Piyyut (liturgical poem)", "why": "The catalogue and FGP say liturgy; passim finds the text of Amos. Both may be right: liturgical poems often quote or rework biblical verses, and passim reports the text it can align. The record keeps both claims, marks the corpus as contested, and does not choose. Settling it needs a person looking at the image.", "rec": {"uri": "https://avichailevy-sys.github.io/geniza-viewer/id/161475434/2", "ie": "161475434", "page": 2, "alma": "990051506630205171", "shelfmark": "Ms. T-S NS 139.20", "library": "Cambridge University Library", "city": "Cambridge", "catalogueTitle": "פיוט.", "passimCoverage": 1, "classification": "contradiction", "nliUrl": "https://www.nli.org.il/en/manuscripts/NNL_ALEPH990051506630205171/NLI", "imgUrl": "https://api.nli.org.il/openlibrary/api/iiif/161475434!2/full/800,/0/default.jpg", "claims": {"passim": {"corpus": "tanakh", "subcorpus": "Prophets", "tractate": "Amos"}, "fgp": {"corpus": "liturgy", "subcorpus": null, "tractate": null}, "ktiv": {"corpus": "liturgy", "subcorpus": null, "tractate": null}}, "levels": {"corpus": {"status": "contested", "value": null, "candidates": [{"value": "liturgy", "sources": ["fgp", "ktiv"]}, {"value": "tanakh", "sources": ["passim"]}]}, "subcorpus": {"status": "single", "value": "Prophets", "candidates": [{"value": "Prophets", "sources": ["passim"]}]}, "tractate": {"status": "single", "value": "Amos", "candidates": [{"value": "Amos", "sources": ["passim"]}]}}}}, {"kind": "disagree", "tag": "Sources disagree", "titleEn": "Bible; Bible [text]", "why": "The reverse case. The catalogue and FGP say Bible; passim matches the text to the prayer book (Siddur). Prayer books contain long biblical passages, so the same words can fit both. Again, both claims are kept with their sources.", "rec": {"uri": "https://avichailevy-sys.github.io/geniza-viewer/id/160090344/2", "ie": "160090344", "page": 2, "alma": "990051421340205171", "shelfmark": "Ms. T-S NS 40.62", "library": "Cambridge University Library", "city": "Cambridge", "catalogueTitle": "מקרא;מקרא [טקסט].", "passimCoverage": 1, "classification": "contradiction", "nliUrl": "https://www.nli.org.il/en/manuscripts/NNL_ALEPH990051421340205171/NLI", "imgUrl": "https://api.nli.org.il/openlibrary/api/iiif/160090344!2/full/800,/0/default.jpg", "claims": {"passim": {"corpus": "liturgy", "subcorpus": "Siddur", "tractate": null}, "fgp": {"corpus": "tanakh", "subcorpus": null, "tractate": null}, "ktiv": {"corpus": "tanakh", "subcorpus": null, "tractate": null}}, "levels": {"corpus": {"status": "contested", "value": null, "candidates": [{"value": "tanakh", "sources": ["fgp", "ktiv"]}, {"value": "liturgy", "sources": ["passim"]}]}, "subcorpus": {"status": "single", "value": "Siddur", "candidates": [{"value": "Siddur", "sources": ["passim"]}]}, "tractate": {"status": null, "value": null, "candidates": []}}}}, {"kind": "disagree", "tag": "Sources disagree", "titleEn": "Glossary to a piyyut", "why": "The catalogue calls this a glossary to a liturgical poem; passim finds Genesis. A glossary explains words, and those words may come from biblical verses the poem draws on. Here the disagreement is about what kind of text this is, not only about where its words come from.", "rec": {"uri": "https://avichailevy-sys.github.io/geniza-viewer/id/159707716/2", "ie": "159707716", "page": 2, "alma": "990051395170205171", "shelfmark": "Ms. T-S NS 26.50", "library": "Cambridge University Library", "city": "Cambridge", "catalogueTitle": "גלוסאר לפיוט.", "passimCoverage": 1, "classification": "contradiction", "nliUrl": "https://www.nli.org.il/en/manuscripts/NNL_ALEPH990051395170205171/NLI", "imgUrl": "https://api.nli.org.il/openlibrary/api/iiif/159707716!2/full/800,/0/default.jpg", "claims": {"passim": {"corpus": "tanakh", "subcorpus": "Torah", "tractate": "Genesis"}, "fgp": {"corpus": "liturgy", "subcorpus": null, "tractate": null}, "ktiv": {"corpus": "liturgy", "subcorpus": null, "tractate": null}}, "levels": {"corpus": {"status": "contested", "value": null, "candidates": [{"value": "liturgy", "sources": ["fgp", "ktiv"]}, {"value": "tanakh", "sources": ["passim"]}]}, "subcorpus": {"status": "single", "value": "Torah", "candidates": [{"value": "Torah", "sources": ["passim"]}]}, "tractate": {"status": "single", "value": "Genesis", "candidates": [{"value": "Genesis", "sources": ["passim"]}]}}}}];

// Word-level comparison (longest common subsequence), ignoring case and punctuation.
function enTokens(t) { return t.split(/\s+/).filter(Boolean); }
function enNorm(w) { return w.toLowerCase().replace(/[“”"‘’',.;:?!()]/g, ''); }
function enDiff(a, b) {
  const A = enTokens(a), B = enTokens(b), n = A.length, m = B.length;
  const na = A.map(enNorm), nb = B.map(enNorm);
  const L = Array.from({ length: n + 1 }, () => new Uint16Array(m + 1));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    L[i][j] = na[i] === nb[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
  const outA = [], outB = []; let i = 0, j = 0;
  while (i < n && j < m) {
    if (na[i] === nb[j]) { outA.push(gnEsc(A[i])); outB.push(gnEsc(B[j])); i++; j++; }
    else if (L[i + 1][j] >= L[i][j + 1]) { outA.push(`<mark class="d-frag">${gnEsc(A[i])}</mark>`); i++; }
    else { outB.push(`<mark class="d-sef">${gnEsc(B[j])}</mark>`); j++; }
  }
  while (i < n) outA.push(`<mark class="d-frag">${gnEsc(A[i++])}</mark>`);
  while (j < m) outB.push(`<mark class="d-sef">${gnEsc(B[j++])}</mark>`);
  return [outA.join(' '), outB.join(' ')];
}
function textSectionHTML(key, rec) {
  const t = EN_TEXTS[key]; if (!t) return '';
  const id = 'tx-' + rec.ie + '-' + rec.page;
  const [fa, sb] = enDiff(t.fragEn, t.sefEn);
  return `
    <div class="txsec" id="${id}">
      <h4 style="margin:18px 0 4px;font-size:14px">4 · The fragment's text and Sefaria, in English</h4>
      <p class="sub" style="font-size:13px;margin:0 0 8px">English rendering for illustration; the comparison itself runs on the original text.
      Where the manuscript and Sefaria agree, the English is identical; where they differ, it differs. Spelling-only differences are not shown.
      Misspelled English words stand for transcription errors.</p>
      <div class="btns" style="margin-top:0">
        <button class="btn" onclick="txMode('${id}','plain')">Side by side</button>
        <button class="btn" onclick="txMode('${id}','diff')">Show differences</button>
        <button class="btn" onclick="txMode('${id}','he')">Original text</button>
      </div>
      <div class="txgrid">
        <div><div class="txhead">Fragment (HTR transcription)</div>
          <div class="txbox m-plain">${gnEsc(t.fragEn)}</div><div class="txbox m-diff" style="display:none">${fa}</div><div class="txbox he m-he" style="display:none">${gnEsc(t.fragHe)}</div></div>
        <div><div class="txhead">Sefaria · ${gnEsc(t.ref)}</div>
          <div class="txbox m-plain">${gnEsc(t.sefEn)}</div><div class="txbox m-diff" style="display:none">${sb}</div><div class="txbox he m-he" style="display:none">${gnEsc(t.sefHe)}</div></div>
      </div>
      <div class="m-diff" style="display:none;font-size:13px;margin-top:6px"><mark class="d-frag">only in the fragment</mark> <mark class="d-sef">only in Sefaria</mark></div>
      <ul class="txnotes">${t.notes.map(([k, v]) => `<li><b>${k}:</b> ${v}</li>`).join('')}</ul>
    </div>`;
}
function txMode(id, mode) {
  document.querySelectorAll('#' + id + ' .m-plain, #' + id + ' .m-diff, #' + id + ' .m-he').forEach(el => {
    el.style.display = el.classList.contains('m-' + mode) ? '' : 'none';
  });
}

const app = document.getElementById('app');
const groups = [
  ['agree', 'When the sources agree'],
  ['complement', 'When the sources complete each other'],
  ['disagree', 'When the sources disagree'],
];
let html = topNavHTML() + `
  <h1>From three identifications to one linked record</h1>
  <p class="sub">Worked examples for the GenizaNexus unified catalogue</p>
  <div class="note">
    Each Cairo Geniza fragment below has been identified three times, independently:
    by <b>passim</b> (computational text-reuse alignment against Sefaria),
    by the <b>Friedberg Geniza Project (FGP)</b>, and by the <b>National Library of Israel catalogue (NLI/KTIV)</b>.
    For each fragment you see (1) what each source says, (2) the unified record, which keeps every value with the sources behind it,
    and (3) the same record as Linked Data. Every record has its own address, links to Wikidata and Sefaria where a mapping exists,
    and can be opened in the viewer. Two examples also show the fragment's text next to the matching Sefaria passage, in English.
  </div>
  <p style="font-size:14px"><b>Status of each level:</b>
    <span class="st confirmed">Confirmed</span> all three sources ·
    <span class="st supported">Supported</span> two sources, third silent ·
    <span class="st single">Single source</span> ·
    <span class="st contested">Contested</span> sources disagree, nothing is chosen</p>
  <ol class="toc">${groups.map(([k, t]) => `<li><a href="#${k}">${t}</a> (${EXAMPLES.filter(e => e.kind === k).length})</li>`).join('')}</ol>`;
for (const [k, t] of groups) {
  html += `<h2 id="${k}">${t}</h2>`;
  EXAMPLES.filter(e => e.kind === k).forEach((e, i) => {
    html += recordCardHTML(e.rec, {
      tag: `<span class="tag ${k}">${e.tag}</span>`,
      titleEn: e.titleEn,
      why: e.why,
      openTtl: false,
    }).replace(/<\/div>\s*$/, textSectionHTML(e.rec.ie + '/' + e.rec.page, e.rec) + '</div>');
  });
}
html += `<p class="sub" style="margin-top:30px">The whole catalogue (68,989 fragment images) can be downloaded as Turtle, JSON-LD or CSV from the viewer. Terms used in the data: <a href="${GN_BASE}ns">GenizaNexus vocabulary</a>. Method: <a href="https://doi.org/10.5281/zenodo.21810900">doi.org/10.5281/zenodo.21810900</a>.</p>`;
app.innerHTML = html;
</script>
